name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 250
      - name: Commit & Push
        run: |
          git config --global user.name "FikzTI"
          git config --global user.email "FikzTI@users.noreply.github.com"
          git add -A .
          git commit -m "GitHub 3D Profile" || exit 0
          git push
